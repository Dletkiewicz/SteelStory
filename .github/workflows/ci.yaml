name: Backend and frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.2'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend including Testcontainers
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Confirm foundation and identity integration reports exist
        run: |
          test -s target/failsafe-reports/TEST-com.steelstory.FoundationIT.xml
          test -s target/failsafe-reports/TEST-com.steelstory.identity.IdentityIT.xml
          test -s target/failsafe-reports/TEST-com.steelstory.identity.IdentityMigrationIT.xml
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@10.8.2
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
