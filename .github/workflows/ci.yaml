name: Backend and frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.2'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend including Testcontainers
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Confirm foundation and identity integration reports exist
        run: |
          test -s target/failsafe-reports/TEST-com.steelstory.FoundationIT.xml
          test -s target/failsafe-reports/TEST-com.steelstory.identity.IdentityIT.xml
          test -s target/failsafe-reports/TEST-com.steelstory.identity.IdentityMigrationIT.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@10.8.2
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
